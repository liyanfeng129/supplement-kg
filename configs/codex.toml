# Codex settings: experiment inputs, so committed and diffable.
#
# Read by engine/models/codex_model.py ([model]) and
# engine/controllers/codex_controller.py ([controller]). An explicit constructor
# argument beats anything here; a missing or malformed file falls back to the
# hardcoded defaults in codex_model.py rather than raising. See
# docs/specs/0012-claude-codex-model-controller.md.

[model]
# The Responses API on the user's ChatGPT plan (Sign in with ChatGPT), never an
# API key. Where `CodexModel().sign_in()` stores the credentials: outside the
# repo, 0600. Sign in once per machine; the refresh token renews itself.
credentials_dir = "~/.config/supplement-kg/chatgpt-plan"
# The pinned model. gpt-6-terra is rejected on a ChatGPT account; gpt-6.1-terra
# is accepted. gpt-6-luna failed 4 of 50 pilot judge labels on the answer checks.
model = "gpt-6.1-terra"
effort = "medium"
# Calls running at once.
n_parallel = 8
# Per call. A starting value, not measured on long labels.
timeout_s = 300
# A rate limit is waited out: rate_limit_wait_s, doubling, rate_limit_waits
# times; still limited after that stops the run (a quota, not a hiccup).
rate_limit_wait_s = 60
rate_limit_waits = 3
# Failed calls in a row, of any kind, that stop the run: 2 x n_parallel.
max_consecutive_failures = 16

[controller]
max_attempts = 3
# Prompts submitted but not yet settled. 0001's rule is ~2x n_parallel; equal to
# n_parallel until the rate limits are known (8 from 2026-10-28, was 4).
in_flight = 8
