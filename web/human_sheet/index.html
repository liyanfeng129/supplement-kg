<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Human sheet</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --ink: #1d2420; --muted: #66706a; --line: #d9ddd8;
    --accent: #3d6fa8; --accent-soft: #e3ecf7; --ok: #2f7d4f; --ok-soft: #e1f1e7;
    --warn: #a35a00; --warn-soft: #fbecd9; --bad: #b3261e; --bad-soft: #fbe3e1;
    --hl: #ffd84d; --hl-edge: #c78f00; --hl-soft: #eef2e6;
    --purpose: #3d6fa8; --risk: #a3402e; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161a18; --panel: #1f2421; --ink: #e6e9e7; --muted: #9aa39e; --line: #353c38;
      --accent: #7fa8d8; --accent-soft: #24344a; --ok: #6cc290; --ok-soft: #1d3326;
      --warn: #e0a050; --warn-soft: #3a2c18; --bad: #f08a80; --bad-soft: #3d2220;
      --purpose: #7fa8d8; --risk: #e08a78; --hl: #8a6d00; --hl-edge: #f0c64a; --hl-soft: #2b3329;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { position: sticky; top: 0; z-index: 2; background: var(--panel); border-bottom: 1px solid var(--line);
           padding: 8px 16px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  .dots { display: flex; gap: 4px; flex-wrap: wrap; }
  .dot { width: 22px; height: 22px; border-radius: 4px; border: 1px solid var(--line); background: var(--bg);
         font-size: 11px; display: grid; place-items: center; cursor: pointer; color: var(--muted); }
  .dot.saved { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
  .dot.dirty { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
  .dot.current { outline: 2px solid var(--accent); outline-offset: 1px; }
  .spacer { flex: 1; }
  button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
           border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; padding: 16px; align-items: start; }
  main.with-rules { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, .8fr); }
  /* The label text stays in view under the header while the claims scroll; --head is the header's height. */
  .textpane { position: sticky; top: calc(var(--head, 60px) + 16px); max-height: calc(100vh - var(--head, 60px) - 32px); overflow: auto; }
  @media (max-width: 900px) { main, main.with-rules { grid-template-columns: minmax(0, 1fr); }
                              .textpane { position: static; max-height: none; } }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; min-width: 0; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 8px; }
  .passage { font-family: var(--mono); font-size: 13px; }
  .passage .ln { padding: 2px 4px; border-bottom: 1px dashed var(--line); white-space: pre-wrap; word-break: break-word; }
  .passage .ln::selection, .passage .ln *::selection { background: var(--accent-soft); }
  .selbar { position: sticky; bottom: 0; background: var(--panel); padding-top: 8px; margin-top: 8px;
            border-top: 1px solid var(--line); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .selbar .sel { font-family: var(--mono); font-size: 12px; color: var(--muted); flex: 1 1 100%;
                 white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .passage .h1 { background: var(--hl-soft); border-radius: 2px; }
  .passage .h2 { text-decoration: underline dashed var(--muted); text-underline-offset: 3px; }
  .passage .h3 { background: var(--hl); border-radius: 2px; box-shadow: 0 0 0 2px var(--hl-edge); font-weight: 600; }
  .passage .ln.has-pick { background: var(--accent-soft); }
  .claim { border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; margin-bottom: 8px; cursor: pointer; }
  .claim.picked, .missed.picked { box-shadow: 0 0 0 2px var(--hl-edge); background: var(--accent-soft); }
  .hlnote { font-size: 12px; color: var(--muted); margin-top: 6px; min-height: 1em; }
  .claim.done { border-left: 4px solid var(--ok); }
  .claim .text { font-family: var(--mono); font-size: 13px; margin-bottom: 6px; word-break: break-word; }
  .tag { display: inline-block; font-weight: 700; margin-right: 6px; }
  .tag.purpose { color: var(--purpose); } .tag.risk { color: var(--risk); }
  .row { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; margin: 4px 0; }
  .row .lbl { width: 88px; color: var(--muted); font-size: 12px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg label { padding: 2px 8px; cursor: pointer; border-right: 1px solid var(--line); font-size: 13px; user-select: none; }
  .seg label:last-child { border-right: 0; }
  .seg input { display: none; }
  .seg label:has(input:checked) { background: var(--accent); color: #fff; }
  .seg label:has(input:disabled) { opacity: .4; cursor: default; }
  .chk { display: inline-flex; gap: 4px; align-items: center; font-size: 13px; cursor: pointer; }
  input[type=text] { font: inherit; width: 100%; border: 1px solid var(--line); border-radius: 6px;
                     background: var(--bg); color: var(--ink); padding: 3px 6px; }
  .missed { border: 1px dashed var(--line); border-radius: 6px; padding: 6px 10px; margin-bottom: 6px; }
  .missed .q { font-family: var(--mono); font-size: 13px; word-break: break-word; }
  .empty { color: var(--muted); font-style: italic; }
  .problems { background: var(--bad-soft); color: var(--bad); border-radius: 6px; padding: 8px 10px; margin-top: 8px; }
  .problems ul { margin: 4px 0 0; padding-left: 18px; }
  .status { font-size: 12px; color: var(--muted); }
  .status.ok { color: var(--ok); }
  .rules { white-space: pre-wrap; font-size: 12.5px; max-height: calc(100vh - var(--head, 60px) - 32px); overflow: auto; position: sticky; top: calc(var(--head, 60px) + 16px); }
  .savebar { display: flex; gap: 8px; align-items: center; margin-top: 12px; }
  .timer { font-family: var(--mono); font-size: 13px; min-width: 4.5em; text-align: right; }
  .timer.paused { color: var(--warn); }
</style>
</head>
<body>
<header>
  <h1>Human sheet</h1>
  <span class="status" id="runname"></span>
  <div class="dots" id="dots"></div>
  <span class="spacer"></span>
  <button id="prev" title="previous label (Alt+←)">← prev</button>
  <span id="pos" class="status"></span>
  <button id="next" title="next label (Alt+→)">next →</button>
  <span class="timer" id="timer" title="time on this label since its last save; paused time is not counted"></span>
  <button id="pause" title="stop the timer while you do something else"></button>
  <button id="rulesBtn">rules</button>
</header>
<main id="main">
  <section class="textpane">
    <h2>Label text</h2>
    <div class="passage" id="passage"></div>
    <div class="hlnote" id="hlnote">click a claim to highlight it in the label</div>
    <div class="selbar">
      <div class="sel" id="sel">select text above to add a missed claim</div>
      <button id="addP" disabled>+ missed purpose</button>
      <button id="addR" disabled>+ missed risk</button>
    </div>
  </section>
  <section>
    <h2>Claims</h2>
    <div id="claims"></div>
    <h2 style="margin-top:14px">Missed claims</h2>
    <div id="missed"></div>
    <div class="savebar">
      <button class="primary" id="save">Save label</button>
      <span class="status" id="saveStatus"></span>
    </div>
    <div id="problems"></div>
  </section>
  <section class="rules" id="rules" hidden></section>
</main>
<script>
"use strict";
let DATA = null;            // {run, cases, saved, rulebook}
let idx = 0;
const drafts = {};          // case_id -> {claims: {claim_id: {...}}, missed: [...], opened_at, active_ms, dirty}
let paused = false;         // the pause button
let clock = null;           // the timer while it runs: {case_id, since}; null when stopped
let selection = "";
let picked = null;          // what is highlighted: {type: "claim", id} or {type: "missed", i}

const $ = (id) => document.getElementById(id);
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const now = () => new Date().toISOString().replace(/\.\d+Z$/, "+00:00");

// The header wraps as the label dots grow: the sticky panes sit below whatever height it has.
new ResizeObserver(() => document.documentElement.style.setProperty(
  "--head", `${document.querySelector("header").offsetHeight}px`)).observe(document.querySelector("header"));

function draftFor(c) {
  if (!drafts[c.case_id]) {
    const saved = DATA.saved[c.case_id];
    const claims = {};
    for (const cl of c.claims) {
      const s = saved && saved.claims.find((v) => v.claim_id === cl.claim_id);
      claims[cl.claim_id] = s ? {...s} : {claim_id: cl.claim_id, faithful: null, actual_kind: null, unsure: false, comment: ""};
    }
    drafts[c.case_id] = {claims, missed: saved ? saved.missed.map((m) => ({...m})) : [], opened_at: now(), active_ms: 0, dirty: false};
  }
  return drafts[c.case_id];
}

function renderDots() {
  $("dots").innerHTML = DATA.cases.map((c, i) => {
    const d = drafts[c.case_id];
    const cls = ["dot", d && d.dirty ? "dirty" : DATA.saved[c.case_id] ? "saved" : "", i === idx ? "current" : ""].join(" ");
    return `<div class="${cls}" data-i="${i}" title="${c.case_id}">${i + 1}</div>`;
  }).join("");
  $("pos").textContent = `${idx + 1} of ${DATA.cases.length} · ${Object.keys(DATA.saved).length} saved`;
}

function seg(name, value, options, disabled) {
  return `<span class="seg">${options.map(([v, t]) =>
    `<label><input type="radio" name="${name}" value="${v}" ${value === v ? "checked" : ""} ${disabled ? "disabled" : ""}>${t}</label>`).join("")}</span>`;
}

// Where `text` sits in `passage`, as [start, end) ranges. Every exact occurrence if it is one
// piece; otherwise the pieces it is stitched from: the longest run of its words (two or more,
// or one word of 4+ letters) found in the passage, preferring the first one after the
// previous piece, then the rest of its words.
function locate(passage, text) {
  const ranges = [];
  if (!text) return ranges;
  for (let at = passage.indexOf(text); at !== -1; at = passage.indexOf(text, at + 1)) ranges.push([at, at + text.length]);
  if (ranges.length) return ranges;
  const words = text.split(/\s+/).filter(Boolean);
  const reEsc = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  let i = 0, after = 0;
  while (i < words.length) {
    let found = null;
    for (let j = words.length; j > i && !found; j--) {
      if (j - i === 1 && words[i].length < 4) break;
      const re = new RegExp(`(?<![\\w])${words.slice(i, j).map(reEsc).join(" ")}(?![\\w])`, "g");
      re.lastIndex = after;
      let m = re.exec(passage);
      if (!m) { re.lastIndex = 0; m = re.exec(passage); }
      if (m) found = [m.index, m.index + m[0].length, j];
    }
    if (found) { ranges.push([found[0], found[1]]); after = found[1]; i = found[2]; } else i++;
  }
  return ranges;
}

// The passage with three layers of ranges: every claim (h1, soft), every missed quote (h2,
// dashed underline), and the picked one (h3, strong), which wins where they overlap.
function renderPassage(c, layers) {
  const level = new Uint8Array(c.passage.length);
  layers.forEach((ranges, n) => { for (const [a, b] of ranges) for (let k = a; k < b; k++) level[k] = Math.max(level[k], n + 1); });
  let off = 0;
  $("passage").innerHTML = c.passage.split("\n").map((line) => {
    const start = off;
    off += line.length + 1;
    let html = "", k = 0, pick = false;
    while (k < line.length) {
      const lv = level[start + k];
      let e = k;
      while (e < line.length && level[start + e] === lv) e++;
      const piece = esc(line.slice(k, e));
      html += lv ? `<span class="h${lv}">${piece}</span>` : piece;
      if (lv === 3) pick = true;
      k = e;
    }
    return `<div class="ln${pick ? " has-pick" : ""}">${html}</div>`;
  }).join("");
}

function highlight() {
  const c = DATA.cases[idx];
  const d = drafts[c.case_id];
  let text = null;
  if (picked && picked.type === "claim") text = (c.claims.find((cl) => cl.claim_id === picked.id) || {}).text;
  if (picked && picked.type === "missed") text = (d.missed[picked.i] || {}).quote;
  const ranges = locate(c.passage, text);
  renderPassage(c, [
    c.claims.flatMap((cl) => locate(c.passage, cl.text)),
    d.missed.flatMap((m) => locate(c.passage, m.quote)),
    ranges,
  ]);
  document.querySelectorAll(".claim, .missed").forEach((el) => el.classList.toggle("picked",
    !!picked && ((picked.type === "claim" && el.dataset.id === picked.id) || (picked.type === "missed" && el.classList.contains("missed") && +el.dataset.i === picked.i))));
  $("hlnote").textContent = !text ? "click a claim to highlight it in the label"
    : !ranges.length ? "not found in the label text"
    : c.passage.includes(text) ? (ranges.length > 1 ? `found ${ranges.length} times` : "found as one piece")
    : `found in ${ranges.length} piece${ranges.length > 1 ? "s" : ""}, not as one`;
  // Bring the highlight into view inside the label pane only: scrollIntoView would also scroll
  // the page, moving the clicked claim out of sight.
  const first = $("passage").querySelector(".h3");
  const pane = document.querySelector(".textpane");
  if (first) {
    const f = first.getBoundingClientRect(), p = pane.getBoundingClientRect();
    if (f.top < p.top) pane.scrollTop += f.top - p.top - 24;
    else if (f.bottom > p.bottom) pane.scrollTop += f.bottom - p.bottom + 48;
  }
}

function render() {
  const c = DATA.cases[idx];
  const d = draftFor(c);
  $("claims").innerHTML = c.claims.length ? c.claims.map((cl) => {
    const v = d.claims[cl.claim_id];
    const done = v.faithful && (v.faithful === "invented" || v.actual_kind);
    const n = esc(cl.claim_id);
    return `<div class="claim ${done ? "done" : ""}" data-id="${n}">
      <div class="text"><span class="tag ${cl.kind}">${cl.kind === "purpose" ? "P" : "R"}:</span>${esc(cl.text)}</div>
      <div class="row"><span class="lbl">faithful</span>${seg(n + "|faithful", v.faithful, [["yes", "yes"], ["invented", "invented"], ["meaning_changed", "meaning changed"]])}</div>
      <div class="row"><span class="lbl">actual kind</span>${seg(n + "|actual_kind", v.actual_kind, [["purpose", "purpose"], ["risk", "risk"], ["neither", "neither"], ["both", "both"]], v.faithful === "invented")}</div>
      <div class="row"><span class="lbl"></span>
        <label class="chk"><input type="checkbox" data-f="unsure" ${v.unsure ? "checked" : ""}>unsure</label></div>
      <div class="row"><input type="text" data-f="comment" placeholder="comment (optional)" value="${esc(v.comment)}"></div>
    </div>`;
  }).join("") : `<div class="empty">no claims were extracted from this label</div>`;
  $("missed").innerHTML = d.missed.length ? d.missed.map((m, i) => `<div class="missed" data-i="${i}">
      <div class="q"><span class="tag ${m.kind}">${m.kind === "purpose" ? "P" : "R"}:</span>${esc(m.quote)}</div>
      <div class="row">${seg("missed" + i + "|kind", m.kind, [["purpose", "purpose"], ["risk", "risk"]])}
        <label class="chk"><input type="checkbox" data-f="unsure" ${m.unsure ? "checked" : ""}>unsure</label>
        <span class="spacer"></span><button data-del="${i}">remove</button></div>
      <div class="row"><input type="text" data-f="comment" placeholder="comment (optional)" value="${esc(m.comment)}"></div>
    </div>`).join("") : `<div class="empty">none — select text in the label to add one</div>`;
  const saved = DATA.saved[c.case_id];
  $("saveStatus").textContent = d.dirty ? "unsaved changes" : saved ? `saved ${saved.saved_at}` : "not saved yet";
  $("saveStatus").className = "status" + (!d.dirty && saved ? " ok" : "");
  $("problems").innerHTML = "";
  $("prev").disabled = idx === 0;
  $("next").disabled = idx === DATA.cases.length - 1;
  renderDots();
  highlight();
}

// Clicking a claim or a missed claim (anywhere but its controls' text) highlights it in the label.
$("claims").addEventListener("click", (e) => {
  const box = e.target.closest(".claim"); if (!box) return;
  picked = {type: "claim", id: box.dataset.id}; highlight();
});
$("missed").addEventListener("click", (e) => {
  const box = e.target.closest(".missed"); if (!box || e.target.dataset.del !== undefined) return;
  picked = {type: "missed", i: +box.dataset.i}; highlight();
});

function touch() {
  const d = drafts[DATA.cases[idx].case_id];
  d.dirty = true;
  $("saveStatus").textContent = "unsaved changes";
  $("saveStatus").className = "status";
  renderDots();
}

$("claims").addEventListener("change", (e) => {
  const box = e.target.closest(".claim"); if (!box) return;
  const v = drafts[DATA.cases[idx].case_id].claims[box.dataset.id];
  if (e.target.type === "radio") {
    const field = e.target.name.split("|")[1];
    v[field] = e.target.value;
    if (field === "faithful" && v.faithful === "invented") v.actual_kind = null;
    touch(); render(); return;
  }
  if (e.target.type === "checkbox") v[e.target.dataset.f] = e.target.checked;
  touch();
});
$("claims").addEventListener("input", (e) => {
  const box = e.target.closest(".claim");
  if (box && e.target.dataset.f === "comment") { drafts[DATA.cases[idx].case_id].claims[box.dataset.id].comment = e.target.value; touch(); }
});
$("missed").addEventListener("change", (e) => {
  const box = e.target.closest(".missed"); if (!box) return;
  const m = drafts[DATA.cases[idx].case_id].missed[+box.dataset.i];
  if (e.target.type === "radio") { m.kind = e.target.value; touch(); render(); return; }
  if (e.target.type === "checkbox") m.unsure = e.target.checked;
  touch();
});
$("missed").addEventListener("input", (e) => {
  const box = e.target.closest(".missed");
  if (box && e.target.dataset.f === "comment") { drafts[DATA.cases[idx].case_id].missed[+box.dataset.i].comment = e.target.value; touch(); }
});
$("missed").addEventListener("click", (e) => {
  if (e.target.dataset.del === undefined) return;
  drafts[DATA.cases[idx].case_id].missed.splice(+e.target.dataset.del, 1);
  touch(); render();
});

// A selection inside the passage, its line breaks kept as the passage has them.
document.addEventListener("selectionchange", () => {
  const s = window.getSelection();
  const inside = s.rangeCount && $("passage").contains(s.getRangeAt(0).commonAncestorContainer);
  if (inside) {
    const lines = [...$("passage").querySelectorAll(".ln")];
    selection = lines.filter((l) => s.containsNode(l, true)).length > 1
      ? s.toString().replace(/\r?\n+/g, "\n").trim()
      : s.toString().trim();
  } else if (!$("addP").contains(document.activeElement) && !$("addR").contains(document.activeElement)) {
    selection = "";
  }
  $("sel").textContent = selection ? `“${selection}”` : "select text above to add a missed claim";
  $("addP").disabled = $("addR").disabled = !selection;
});
function addMissed(kind) {
  if (!selection) return;
  drafts[DATA.cases[idx].case_id].missed.push({quote: selection, kind, unsure: false, comment: ""});
  selection = ""; window.getSelection().removeAllRanges();
  touch(); render();
}
$("addP").addEventListener("mousedown", (e) => e.preventDefault());
$("addR").addEventListener("mousedown", (e) => e.preventDefault());
$("addP").addEventListener("click", () => addMissed("purpose"));
$("addR").addEventListener("click", () => addMissed("risk"));

// The timer counts time on the shown label only: it stops on the pause button, while the tab
// is hidden, and on a switch to another label, which then starts its own.
function stopClock() {
  if (clock) { drafts[clock.case_id].active_ms += Date.now() - clock.since; clock = null; }
}
function startClock() {
  stopClock();
  if (!paused && !document.hidden) clock = {case_id: DATA.cases[idx].case_id, since: Date.now()};
  renderTimer();
}
function renderTimer() {
  const c = DATA.cases[idx];
  const ms = drafts[c.case_id].active_ms + (clock && clock.case_id === c.case_id ? Date.now() - clock.since : 0);
  const s = Math.floor(ms / 1000);
  $("timer").textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
  $("timer").classList.toggle("paused", !clock);
  $("pause").textContent = paused ? "▶ resume" : "❚❚ pause";
}
$("pause").addEventListener("click", () => { paused = !paused; startClock(); });
document.addEventListener("visibilitychange", () => { if (DATA) startClock(); });
setInterval(() => { if (DATA) renderTimer(); }, 1000);

$("save").addEventListener("click", async () => {
  const c = DATA.cases[idx];
  const d = drafts[c.case_id];
  const missing = c.claims.filter((cl) => { const v = d.claims[cl.claim_id]; return !v.faithful || (v.faithful !== "invented" && !v.actual_kind); });
  if (missing.length) {
    $("problems").innerHTML = `<div class="problems">Give faithful and actual kind for every claim first (${missing.length} left).</div>`;
    return;
  }
  $("save").disabled = true;
  // The time up to this click goes with this save; the timer runs on meanwhile.
  startClock();
  const ms = d.active_ms;
  try {
    const body = {case_id: c.case_id, dsld_id: c.dsld_id, claims: c.claims.map((cl) => d.claims[cl.claim_id]), missed: d.missed,
                  opened_at: d.opened_at, active_seconds: Math.round(ms / 1000)};
    const r = await fetch("api/verdict", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
    const res = await r.json();
    if (res.problems.length) {
      $("problems").innerHTML = `<div class="problems">Not saved:<ul>${res.problems.map((p) => `<li>${esc(p)}</li>`).join("")}</ul></div>`;
    } else {
      DATA.saved[c.case_id] = {...body, saved_at: res.saved_at};
      d.dirty = false; d.opened_at = now(); d.active_ms -= ms;
      render();
    }
  } catch (err) {
    $("problems").innerHTML = `<div class="problems">Not saved: ${esc(String(err))}. Is the server still running?</div>`;
  } finally {
    $("save").disabled = false;
  }
});

function go(i) { if (i >= 0 && i < DATA.cases.length) { idx = i; picked = null; render(); startClock(); window.scrollTo(0, 0); } }
$("prev").addEventListener("click", () => go(idx - 1));
$("next").addEventListener("click", () => go(idx + 1));
$("dots").addEventListener("click", (e) => { if (e.target.dataset.i) go(+e.target.dataset.i); });
document.addEventListener("keydown", (e) => {
  if (e.altKey && e.key === "ArrowLeft") go(idx - 1);
  if (e.altKey && e.key === "ArrowRight") go(idx + 1);
});
$("rulesBtn").addEventListener("click", () => {
  $("rules").hidden = !$("rules").hidden;
  $("main").classList.toggle("with-rules", !$("rules").hidden);
});
window.addEventListener("beforeunload", (e) => { if (Object.values(drafts).some((d) => d.dirty)) e.preventDefault(); });

fetch("api/cases").then((r) => r.json()).then((data) => {
  DATA = data;
  $("runname").textContent = data.run;
  $("rules").textContent = data.rulebook;
  const first = data.cases.findIndex((c) => !data.saved[c.case_id]);
  go(first === -1 ? 0 : first);
}).catch((err) => { document.body.innerHTML = `<p style="padding:16px">Could not load cases: ${esc(String(err))}</p>`; });
</script>
</body>
</html>
